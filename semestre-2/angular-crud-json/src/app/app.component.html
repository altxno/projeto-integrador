<ng-container *ngIf="authService.usuarioAtual$ | async as usuario; else authTemplate">
  <!-- Layout Completo com Sidebar para Usuário Autenticado -->
  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav #sidenav mode="side" [opened]="true" class="sidenav mat-elevation-z4">
      <div class="sidebar-header">
        <div class="artist-avatar">
          <mat-icon>brush</mat-icon>
        </div>
        <div class="artist-info">
          <span class="artist-name">{{ usuario.nome }}</span>
          <span class="artist-email">{{ usuario.email }}</span>
        </div>
      </div>

      <mat-divider></mat-divider>

      <mat-nav-list class="nav-list">
        <div class="nav-section-title">Comissões & Pedidos</div>
        <a mat-list-item routerLink="/pedidos" routerLinkActive="active-nav">
          <mat-icon matListItemIcon>palette</mat-icon>
          <span matListItemTitle>Painel de Pedidos</span>
        </a>
        <a mat-list-item routerLink="/pedidos/novo" routerLinkActive="active-nav">
          <mat-icon matListItemIcon>add_task</mat-icon>
          <span matListItemTitle>Novo Pedido</span>
        </a>

        <div class="nav-section-title">Clientes</div>
        <a mat-list-item routerLink="/clientes" routerLinkActive="active-nav">
          <mat-icon matListItemIcon>people</mat-icon>
          <span matListItemTitle>Lista de Clientes</span>
        </a>
        <a mat-list-item routerLink="/clientes/novo" routerLinkActive="active-nav">
          <mat-icon matListItemIcon>person_add</mat-icon>
          <span matListItemTitle>Cadastrar Cliente</span>
        </a>

        <mat-divider class="my-3"></mat-divider>

        <a mat-list-item (click)="logout()" class="nav-logout">
          <mat-icon matListItemIcon color="warn">logout</mat-icon>
          <span matListItemTitle>Sair do Sistema</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="sidenav-content">
      <mat-toolbar color="primary" class="top-toolbar">
        <button mat-icon-button (click)="sidenav.toggle()" matTooltip="Alternar Sidebar">
          <mat-icon>menu</mat-icon>
        </button>
        <div class="brand-title">
          <mat-icon class="brand-icon">art_track</mat-icon>
          <span>Ateliê — Gestão de Comissões de Arte</span>
        </div>

        <span class="toolbar-spacer"></span>

        <div class="user-greeting">
          <mat-icon>account_circle</mat-icon>
          <span>{{ usuario.nome }}</span>
        </div>

        <button mat-icon-button (click)="logout()" matTooltip="Sair">
          <mat-icon>logout</mat-icon>
        </button>
      </mat-toolbar>

      <main class="page-container">
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</ng-container>

<ng-template #authTemplate>
  <!-- Layout Limpo para Login / Registro -->
  <main class="auth-page-container">
    <router-outlet></router-outlet>
  </main>
</ng-template>
