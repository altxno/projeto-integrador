    <span class="app-title">CRUD Clientes</span>
  </div>

  <span class="toolbar-spacer"></span>

  <nav class="nav-links">
    <a mat-button routerLink="/listagem" routerLinkActive="active-link">
      <mat-icon>format_list_bulleted</mat-icon>

      <mat-icon>person_add</mat-icon>

    <a mat-button routerLink="/consultar" routerLinkActive="active-link">
