<div class="delete-wrapper">
  <mat-card class="delete-card">
    <mat-card-header class="card-header">
      <div mat-card-avatar>
        <mat-icon class="header-icon">delete_forever</mat-icon>
      </div>
      <mat-card-title>Excluir Cliente</mat-card-title>
      <mat-card-subtitle>Remova o registro de um cliente informando o seu ID</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="card-content">
      <div class="warning-banner">
        <mat-icon class="warning-icon">warning</mat-icon>
        <div>
          <strong>Atenção:</strong> A exclusão de um registro é permanente e não poderá ser desfeita.
        </div>
      </div>

      <form (ngSubmit)="excluirCliente()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Código / ID para exclusão</mat-label>
          <input
            matInput
            type="text"
            [(ngModel)]="idExcluir"
            name="idExcluir"
            placeholder="Ex: 1"
            required
          />
          <mat-icon matPrefix>tag</mat-icon>
        </mat-form-field>

        <div class="form-actions">
          <button mat-button type="button" routerLink="/listagem">
            Voltar para Lista
          </button>
          <button mat-raised-button color="warn" type="submit" [disabled]="excluindo">
            <mat-icon>delete</mat-icon>
            Excluir Registro
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
