<div class="form-wrapper">
  <mat-card class="form-card">
    <mat-card-header class="card-header">
      <div mat-card-avatar>
        <mat-icon class="header-icon">person_add</mat-icon>
      </div>
      <mat-card-title>Cadastro de Cliente</mat-card-title>
      <mat-card-subtitle>Preencha os dados abaixo para cadastrar um novo cliente</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="card-content">
      <form [formGroup]="form" (ngSubmit)="submeter()">
        <!-- Campo Nome -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nome Completo</mat-label>
          <input matInput formControlName="nome" placeholder="Ex: Maria Silva" />
          <mat-icon matPrefix>badge</mat-icon>
          <mat-error *ngIf="form.get('nome')?.hasError('required')">
            O nome é obrigatório.
          </mat-error>
          <mat-error *ngIf="form.get('nome')?.hasError('minlength')">
            O nome deve ter pelo menos 2 caracteres.
          </mat-error>
        </mat-form-field>

        <!-- Campo E-mail -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>E-mail</mat-label>
          <input matInput type="email" formControlName="email" placeholder="Ex: maria@email.com" />
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngIf="form.get('email')?.hasError('required')">
            O e-mail é obrigatório.
          </mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">
            Informe um e-mail válido.
          </mat-error>
        </mat-form-field>

        <!-- Campo Telefone -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Telefone</mat-label>
          <input matInput formControlName="telefone" placeholder="Ex: (11) 98765-4321" />
          <mat-icon matPrefix>phone</mat-icon>
          <mat-error *ngIf="form.get('telefone')?.hasError('required')">
            O telefone é obrigatório.
          </mat-error>
        </mat-form-field>

        <div class="form-actions">
          <button mat-button type="button" routerLink="/listagem">
            Cancelar
          </button>
          <button mat-raised-button color="primary" type="submit" [disabled]="salvando">
            <mat-icon>save</mat-icon>
            Cadastrar
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
